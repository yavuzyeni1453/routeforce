<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RouteForce — Yönetim</title><style>:root{--b:#07121b;--p:#0d1d29;--l:#294357;--t:#eaf1f6;--m:#9baab7;--a:#73e7b3}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px Inter,system-ui}.top{height:66px;padding:0 28px;border-bottom:1px solid var(--l);display:flex;align-items:center;gap:20px}.brand{font-size:20px;font-weight:850;letter-spacing:-.05em}.brand b{color:var(--a)}a{color:var(--m);text-decoration:none}.wrap{max-width:900px;margin:auto;padding:36px 25px}.ey{font-size:10px;letter-spacing:.14em;color:var(--a);font-weight:800}h1{font-size:27px;margin:7px 0 4px}p{color:var(--m)}.card{margin-top:24px;border:1px solid var(--l);border-radius:12px;background:var(--p);overflow:hidden}.head,.row{display:grid;grid-template-columns:1.3fr 1.2fr .8fr;gap:12px;align-items:center;padding:14px}.head{font-size:10px;letter-spacing:.1em;color:var(--m);border-bottom:1px solid var(--l)}.row{border-bottom:1px solid #20394a}.row:last-child{border:0}.row strong{display:block}.row small{color:var(--m)}button{border:0;border-radius:7px;padding:7px 10px;font-size:11px;font-weight:800;cursor:pointer}.approve{background:var(--a);color:#092119}.reject{background:#3c2830;color:#ffc2c2;margin-left:6px}.empty{padding:25px;color:var(--m)}</style><body><header class="top"><div class="brand">Route<b>Force</b></div><a href="/app.html">Projeler</a><a href="/">BGP Studio</a></header><main class="wrap"><div class="ey">YÖNETİM</div><h1>Erişim başvuruları</h1><p>Onaylanan kullanıcılar proje ve config geçmişine erişebilir.</p><section class="card"><div class="head"><div>KULLANICI</div><div>BAŞVURU</div><div>İŞLEM</div></div><div id="list"><div class="empty">Yükleniyor…</div></div></section></main><script>async function load(){const r=await fetch('/api/admin/requests');if(r.status===403){location='/app.html';return}const d=await r.json(),list=document.querySelector('#list');list.innerHTML=d.users.length?'':'<div class="empty">Bekleyen başvuru yok.</div>';d.users.forEach(u=>{const row=document.createElement('div');row.className='row';row.innerHTML='<div><strong></strong><small></small></div><div><small>'+new Date(u.created_at+'Z').toLocaleString('tr-TR')+'</small></div><div><button class="approve">Onayla</button><button class="reject">Reddet</button></div>';row.querySelector('strong').textContent=u.github_login;row.querySelector('small').textContent=u.email;row.querySelector('.approve').onclick=()=>change(u.id,'approved');row.querySelector('.reject').onclick=()=>change(u.id,'rejected');list.append(row)})}async function change(id,status){await fetch('/api/admin/requests',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});load()}load()</script></body></html>
